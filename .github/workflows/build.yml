name: Build Android Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Build Unsigned Release APK
      run: |
        export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
        # We target 'release' so Buildozer builds a clean, unsigned base app
        buildozer -v android release

    - name: Decode JKS Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Align and Sign Production APK
      env:
        STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        mkdir -p final-bin/
        RAW_APK=$(find bin/ -name "*_release~*.apk" -o -name "*release-unsigned.apk" -o -name "*.apk" | head -n 1)
        
        if [ -n "$RAW_APK" ]; then
          # Find Android Build Tools path dynamically for alignment
          BUILD_TOOLS_DIR=$(dirname $(find /home/runner/Library/Android/sdk/build-tools/ -name "zipalign" | sort -V | tail -n 1))
          
          # 1. Zip Align the package first (Required for production apps)
          $BUILD_TOOLS_DIR/zipalign -v 4 "$RAW_APK" final-bin/aligned.apk
          
          # 2. Use apksigner to seal the binary cleanly with your credentials
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore \
            --ks-pass pass:"$STORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --ks-key-alias subho-alias \
            --out final-bin/dragonhole-final.apk final-bin/aligned.apk
            
          echo "Build signed successfully!"
        else
          echo "ERROR: Compiled release target could not be found!"
          exit 1
        fi

    - name: Upload Production APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Android-Package
        path: final-bin/dragonhole-final.apk
