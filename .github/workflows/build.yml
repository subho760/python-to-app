name: Production Multi-Build Release


on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 python3-dev zip libltdl-dev libffi-dev libssl-dev autoconf automake libtool pkg-config cmake
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.33

      - name: Prepare Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          mkdir -p staging

      - name: Build Release APK
        run: |
          # Build specifically for APK first
          sed -i 's/android.release_artifact = aab/android.release_artifact = apk/' buildozer.spec
          buildozer android release
          mv bin/*.apk staging/unsigned.apk

      - name: Build Release AAB
        run: |
          # Swap target to AAB
          sed -i 's/android.release_artifact = apk/android.release_artifact = aab/' buildozer.spec
          buildozer android release
          mv bin/*.aab staging/unsigned.aab

      - name: Final Manual Signing Step
        run: |
          # Sign the APK
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            staging/unsigned.apk subho-alias

          # Sign the AAB
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            staging/unsigned.aab subho-alias

          # Final Rename
          mv staging/unsigned.apk bin/Release_API33.apk
          mv staging/unsigned.aab bin/Release_API33.aab

      - name: Upload Finished Assets
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-Binaries
          path: |
            bin/Release_API33.apk
            bin/Release_API33.aab
