name: Build Android Signed APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-17-jdk bundletool

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Decode JKS Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Compile and Natively Sign Android App Bundle (AAB)
      env:
        P4A_RELEASE_KEYSTORE: release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: subho-alias
        P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
        APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      run: |
        # Make sure the target spec is explicitly set to build the AAB bundle first
        sed -i 's/^android.target =.*/android.target = aab/' buildozer.spec
        buildozer -v android release

    - name: Extract Signed APK from Bundle (Instant Conversion)
      env:
        STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        mkdir -p final-bin/
        
        # 1. Locate the native signed AAB file generated by buildozer
        BUILDOZER_AAB=$(find bin/ -name "*.aab" | head -n 1)
        
        if [ -n "$BUILDOZER_AAB" ]; then
          cp "$BUILDOZER_AAB" final-bin/dragonhole-release.aab
          
          # 2. Use official Android bundletool to instantly generate a universal installable APK
          bundletool build-apks --bundle=final-bin/dragonhole-release.aab \
            --output=final-bin/temp.apks \
            --mode=universal \
            --ks=release.keystore \
            --ks-pass=pass:"$STORE_PASS" \
            --ks-key-alias=subho-alias \
            --key-pass=pass:"$KEY_PASS"
            
          # Extract the signed universal .apk out of the zip package container
          unzip -p final-bin/temp.apks universal.apk > final-bin/dragonhole-release.apk
          rm -f final-bin/temp.apks
          
          echo "Successfully created and structured both packages!"
        else
          echo "ERROR: Compiled target AAB file not found!"
          exit 1
        fi

    - name: Upload Signed Packages (Both APK & AAB)
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Android-Packages
        path: final-bin/
