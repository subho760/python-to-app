name: Pure Python Debug Build

on:
  workflow_dispatch: # Manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Base Linux Tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-11-jdk libunwind-dev

    - name: Install Build Frameworks
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Compile Android App Bundle (AAB)
      run: |
        sed -i 's/^android.target =.*/android.target = aab/' buildozer.spec
        # Using debug mode completely bypasses the internal signing bug
        buildozer -v android debug

    - name: Save AAB Output
      run: |
        mkdir -p final-bin/
        FOUND_AAB=$(find . -name "*.aab" | head -n 1)
        if [ -n "$FOUND_AAB" ]; then
          cp "$FOUND_AAB" final-bin/dragonhole-debug.aab
        fi

    - name: Clear Intermediate Build Cache
      run: |
        rm -rf .buildozer/android/platform/build-*

    - name: Compile Android Installer (APK)
      run: |
        sed -i 's/^android.target =.*/android.target = apk/' buildozer.spec
        buildozer -v android debug

    - name: Save APK Output
      run: |
        FOUND_APK=$(find . -name "*.apk" | head -n 1)
        if [ -n "$FOUND_APK" ]; then
          cp "$FOUND_APK" final-bin/dragonhole-debug.apk
        fi

    - name: Export Packages
      uses: actions/upload-artifact@v4
      with:
        name: Debug-Android-Packages
        path: final-bin/
