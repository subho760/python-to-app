name: Build Android Signed APK

on:
  workflow_dispatch: # Manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Build with Buildozer
      run: |
        export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
        buildozer -v android debug

    - name: Decode JKS Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Sign APK Binary with Keystore
      env:
        STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        mkdir -p final-bin/
        RAW_APK=$(find bin/ -name "*.apk" | head -n 1)
        if [ -n "$RAW_APK" ]; then
          cp "$RAW_APK" final-bin/dragonhole-signed.apk
          # Using standard Java jarsigner to securely apply your credentials
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore release.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            final-bin/dragonhole-signed.apk subho-alias
        else
          echo "ERROR: Compiled APK path not found!"
          exit 1
        fi

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Android-Package
        path: final-bin/
