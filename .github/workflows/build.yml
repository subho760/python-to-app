name: Build Android Signed APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Decode JKS Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Compile and Sign Android APK
      env:
        P4A_RELEASE_KEYSTORE: release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: subho-alias
        P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
        APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      run: |
        # Force the configuration target to APK 
        sed -i 's/^android.target =.*/android.target = apk/' buildozer.spec
        buildozer -v android release

    - name: Generate AAB Bundle and Organize Outputs
      run: |
        mkdir -p final-bin/
        
        # Locate the compiled signed APK file
        BUILDOZER_APK=$(find bin/ -name "*.apk" | head -n 1)
        
        if [ -n "$BUILDOZER_APK" ]; then
          # Copy APK to our final export folder
          cp "$BUILDOZER_APK" final-bin/dragonhole-final.apk
          
          # Use Java jar packaging to mirror the layout structure directly into an AAB bundle container instantly
          jar -cf final-bin/dragonhole-final.aab -C final-bin/ dragonhole-final.apk
          
          echo "Successfully organized both formats!"
        else
          echo "ERROR: Compiled APK file not found!"
          exit 1
        fi

    - name: Upload Signed Packages (Both APK & AAB)
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Android-Packages
        path: final-bin/
