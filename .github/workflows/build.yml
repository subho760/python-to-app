name: Production Build (Android Release)

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-11-jdk libunwind-dev \
          libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Decode Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Build Android Release (AAB)
      env:
        APP_ANDROID_ARCHS: arm64-v8a,armeabi-v7a
        P4A_RELEASE_KEYSTORE: release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: subho-alias
        P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Ensure target is set to AAB
        sed -i 's/^android.target =.*/android.target = aab/' buildozer.spec
        buildozer -v android release

    - name: Upload Signed Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-release-package
        path: bin/
