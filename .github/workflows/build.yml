name: Pure Python Production Build

on:
  workflow_dispatch: # Kept manual to give you ultimate running control

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install Base Linux Tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-11-jdk libunwind-dev

    - name: Install Build Frameworks
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Deploy Local Keyring file
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Compile and Sign Android App (AAB)
      env:
        P4A_RELEASE_KEYSTORE: release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: subho-alias
        P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
      run: |
        sed -i 's/^android.target =.*/android.target = aab/' buildozer.spec
        buildozer -v android release

    - name: Clear Intermediate Build Cache
      run: |
        rm -rf .buildozer/android/platform/build-*

    - name: Compile and Sign Android Installer (APK)
      env:
        P4A_RELEASE_KEYSTORE: release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: subho-alias
        P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
      run: |
        sed -i 's/^android.target =.*/android.target = apk/' buildozer.spec
        buildozer -v android release

    - name: Export Verified Packages
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Android-Packages
        path: bin/
