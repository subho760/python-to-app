name: Build Android Signed APK & AAB

on:
  workflow_dispatch: # Manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-17-jdk

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Decode JKS Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Compile and Sign Android App Bundle (AAB)
      env:
        P4A_RELEASE_KEYSTORE: release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: subho-alias
        P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
        APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      run: |
        # Explicitly make sure target is set to aab first
        sed -i 's/^android.target =.*/android.target = aab/' buildozer.spec
        buildozer -v android release

    - name: Compile and Sign Android Installer Package (APK)
      env:
        P4A_RELEASE_KEYSTORE: release.keystore
        P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
        P4A_RELEASE_KEYALIAS: subho-alias
        P4A_RELEASE_KEY_PASSWD: ${{ secrets.KEY_PASSWORD }}
        APP_ANDROID_ACCEPT_SDK_LICENSE: "True"
      run: |
        # Switch the target line in your spec file to apk dynamically
        sed -i 's/^android.target =.*/android.target = apk/' buildozer.spec
        buildozer -v android release

    - name: Upload Signed Packages (Both APK & AAB)
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Android-Packages
        path: bin/
