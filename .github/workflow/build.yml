name: Build Custom Wrapper (APK & AAB)

on:
  workflow_dispatch: # Manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git zip unzip gettext libncurses5-dev \
          libncursesw5-dev zlib1g-dev libssl-dev libffi-dev libltdl-dev libtool \
          autoconf automake pkg-config cmake openjdk-11-jdk libunwind-dev \
          libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install 'cython==0.29.33' virtualenv buildozer

    - name: Decode JKS Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    - name: Build and Sign AAB (Google Play Bundle)
      run: |
        # Force spec target to AAB
        sed -i 's/^android.target =.*/android.target = aab/' buildozer.spec
        buildozer -v android release || true
        
        # Manually extract and sign the AAB to bypass tracking bugs
        mkdir -p bin/
        RAW_AAB=$(find . -name "*.aab" | head -n 1)
        if [ ! -z "$RAW_AAB" ]; then
          cp "$RAW_AAB" bin/dragonhole-release.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            bin/dragonhole-release.aab subho-alias
        else
          echo "AAB file not generated!" && exit 1
        fi

    - name: Clean Runner Cache for APK Target
      run: |
        # Clear specific temporary android builds to force clean binary compilation
        rm -rf .buildozer/android/platform/build-*

    - name: Build and Sign APK (Mobile Testing)
      run: |
        # Force spec target to APK
        sed -i 's/^android.target =.*/android.target = apk/' buildozer.spec
        buildozer -v android release || true
        
        # Manually extract and sign the APK
        RAW_APK=$(find . -name "*.apk" | head -n 1)
        if [ ! -z "$RAW_APK" ]; then
          cp "$RAW_APK" bin/dragonhole-release.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            bin/dragonhole-release.apk subho-alias
        else
          echo "APK file not generated!" && exit 1
        fi

    - name: Upload Both Signed Packages
      uses: actions/upload-artifact@v4
      with:
        name: Signed-Android-Packages
        path: bin/
